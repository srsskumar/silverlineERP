# Advisories the Security workflow (.github/workflows/security.yml) is told
# to ignore, each with the reason and a date after which it is reported
# again. An entry here is a decision with an owner, not a suppression: when
# the date passes, the gate goes red until the upgrade lands or the entry is
# renewed with a new reason. See docs/security/2026-10-28/SECURITY_FINDINGS.md
# (DEP-*) for the full write-up of each.

# zod 3.x: memory exhaustion on oversized constrained collections. The
# application moved to zod 4 on 2026-10-29 (DEP-2 closed); the one copy of
# zod 3 left is nested under @expo/cli, Expo's build tooling, which parses
# the app's own config at build time and never sees request bodies. Clears
# when Expo's CLI moves to zod 4.
[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2026-12-31
reason = "only reachable copy is @expo/cli's nested zod 3 (build tooling); the API, web and mobile code run zod 4"

# deepmerge, reached only through @expo/config / @expo/cli: merges the app's
# own config files at build time, never untrusted input. Clears when Expo's
# tooling moves off it (DEP-5).
[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2026-12-31
reason = "build-time config merging of trusted files via @expo/config; tracked as DEP-5"
