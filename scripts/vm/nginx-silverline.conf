# nginx site for the Silverline VM. Installed by silverline-deploy as
# /etc/nginx/sites-available/silverline, and only after `nginx -t` accepts it.
#
# It lived only on the server until now, so nothing in the repository said how
# the site was served: deep links, headers and the API proxy could drift from
# the code with nobody able to see it in review.
#
# The web is the static export. It is served from a release directory that
# the deploy switches with a symlink, not from the build directory itself:
# `next build` empties .next-verify before it writes, and nginx served that
# directory directly, so every deploy blanked the site for the length of the
# build.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/silverline-web/current;
    index index.html;
    # Relative Location headers, so a redirect keeps whatever scheme, host and
    # port the browser used -- including a proxy or TLS put in front later.
    absolute_redirect off;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The same policy as apps/web/public/_headers, adjusted for this host.
    #
    # connect-src is 'self' rather than any https: origin, because here the
    # API is the same origin, proxied below. The tile host is listed there too
    # because MapLibre fetches raster tiles rather than loading them as <img>.
    #
    # geolocation is allowed for this origin: the web punch clock asks for the
    # position, and geolocation=() -- what _headers had -- refuses it silently.
    #
    # No Strict-Transport-Security and no upgrade-insecure-requests while the
    # site is plain HTTP: the first is ignored without TLS, and the second
    # would send every request to an https:// that does not answer. Add both
    # with the certificate.
    #
    # `always`, and repeated in every location that sets its own add_header,
    # because nginx drops the server-level set in any location that adds one.
    set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://tile.openstreetmap.org; worker-src 'self' blob:; manifest-src 'self'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # No Cross-Origin-Opener-Policy until TLS: over plain HTTP the browser
    # ignores it and says so in the console on every page. Add it with the
    # certificate, alongside Strict-Transport-Security.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API trusts these from loopback only (trustProxy), which is what
        # lets it rate-limit and audit by the caller's address instead of
        # seeing every request arrive from 127.0.0.1.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3101/health;
        access_log off;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Cloudflare's files. They mean nothing to nginx and describe the site's
    # policy to anyone who asks, so they are not served.
    location ~ ^/_(headers|redirects)$ { return 404; }

    location / {
        # HTML must revalidate so a deploy is picked up on the next load.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
        try_files $uri $uri.html $uri/index.html @record;
    }

    # Canonical record URLs.
    #
    # The export prerenders each dynamic route once, for the id
    # __placeholder__, so there is no file for /projects/<real-id>. Links
    # inside the app already go to /record?type=&id= (lib/routes.ts
    # staticHref); these send a pasted link, a bookmark or a refresh there too.
    # The previous fallback served /index.html for every unknown path, which
    # answered 200 and dropped the person on the home page with the record
    # they asked for lost.
    #
    # The same rules as apps/web/public/_redirects, most specific first. Real
    # pages such as /projects/new never get here: try_files finds their file.
    location @record {
        rewrite ^/projects/([^/]+)/tasks/([^/]+)/?$ /record?type=task&project=$1&id=$2? redirect;
        rewrite ^/projects/([^/]+)/board/?$         /record?type=board&id=$1?              redirect;
        rewrite ^/attendance/records/([^/]+)/?$     /record?type=attendance&id=$1?         redirect;
        rewrite ^/projects/([^/]+)/?$               /record?type=project&id=$1?            redirect;
        rewrite ^/employees/([^/]+)/?$              /record?type=employee&id=$1?           redirect;
        rewrite ^/leave/([^/]+)/?$                  /record?type=leave&id=$1?              redirect;
        rewrite ^/payroll/([^/]+)/?$                /record?type=payroll&id=$1?            redirect;
        return 404;
    }

    error_page 404 /404.html;
}
