name: Verify Silverline
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: silverline
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: silverline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U silverline -d silverline_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://silverline:ci-only-password@localhost:5432/silverline_test
      NEXT_PUBLIC_API_URL: http://localhost:3101
      EXPO_PUBLIC_API_URL: http://localhost:3101
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Production dependencies, critical only, here; the Security workflow
      # (osv-scanner, with dated and reasoned ignores in osv-scanner.toml)
      # is the gate for highs and for dev tooling. Until 2026-10-28 this step
      # had never run: the job failed earlier, on a test-database setup bug,
      # on every push since 2026-10-09.
      - run: npm audit --omit=dev --audit-level=critical
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-builds
          path: |
            apps/web/.next-verify
            apps/api/dist
            apps/mobile/dist
          retention-days: 7
