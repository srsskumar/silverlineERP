name: Verify Silverline
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: silverline
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: silverline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U silverline -d silverline_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://silverline:ci-only-password@localhost:5432/silverline_test
      NEXT_PUBLIC_API_URL: http://localhost:3101
      EXPO_PUBLIC_API_URL: http://localhost:3101
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: verified-builds
          path: |
            apps/web/.next-verify
            apps/api/dist
            apps/mobile/dist
          retention-days: 7
