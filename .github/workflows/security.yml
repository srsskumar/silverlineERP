# Security gates that do not need a database (the main `Verify Silverline`
# workflow runs the test suites and `npm audit --audit-level=high`).
#
# - Secret scanning over the whole history (gitleaks).
# - Known-vulnerability scanning of every lockfile against OSV (osv-scanner),
#   which sees advisories npm audit does not.
# - Static analysis with semgrep's default and OWASP rule packs.
#
# Actions are pinned to full commit SHAs (the tag is noted beside each) so a
# repointed tag cannot change what runs here; bump deliberately. Each job fails the workflow on findings so a red check is a
# real one, not a report nobody opens.
name: Security
on:
  push:
  pull_request:
  schedule:
    # Weekly, so a newly published advisory against an unchanged lockfile
    # still turns the badge red.
    - cron: '0 2 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dependencies:
    name: Dependency vulnerabilities (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --fail-on-vuln
  static-analysis:
    name: Static analysis (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # scripts/qa holds probes that deliberately speak plain HTTP to a local
      # API; scripts/vm is the retired single-VM nginx config. Neither ships.
      - run: semgrep scan --config p/default --config p/owasp-top-ten --config p/typescript --error --exclude node_modules --exclude 'apps/mobile/android' --exclude 'apps/mobile/ios' --exclude graphify-out --exclude scripts/qa --exclude scripts/vm
